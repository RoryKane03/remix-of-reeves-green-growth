<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Deny optional measurement until the existing consent flow resolves. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){window.dataLayer.push(arguments);};
      window.gtag('consent', 'default', {ad_storage:'denied', ad_user_data:'denied', ad_personalization:'denied', analytics_storage:'denied'});
      // Consume a successful quote receipt before any provider can inspect this URL.
      if (location.pathname.replace(/\/$/, '') === '/thank-you') {
        try {
          const receipt = JSON.parse(sessionStorage.getItem('rts_quote_receipt') || 'null');
          sessionStorage.removeItem('rts_quote_receipt');
          const age = receipt ? Date.now() - receipt.createdAt : -1;
          window.__quoteConfirmed = !!(receipt && /^[0-9a-f-]{36}$/i.test(receipt.quoteId) && age >= 0 && age < 300000);
          window.__quoteTrackingAllowed = window.__quoteConfirmed && receipt.trackingAllowed === true;
          if (!window.__quoteConfirmed && location.search !== '?confirmation=untracked') location.replace('/contact');
        } catch { location.replace('/contact'); }
      }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Default SEO tags. prerender.js replaces everything between the seo markers
         with each page's own title, description, canonical and schema from <SEO>/<Helmet>. -->
    <!--seo-start-->
    <title>Reeves Tree Surgeons | ARB Approved Tree Surgeons, Bromsgrove</title>
    <meta name="description" content="Family-run Bromsgrove tree surgeons since 2002, ARB Approved since 2020. 24/7 emergency call-outs across the West Midlands. Call 01527 874143.">
    <!--seo-end-->
    <meta name="author" content="Reeves Tree Surgeons">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://storage.googleapis.com/gpt-engineer-file-uploads/4iKOJALornW8xuSxkYFSbIs3tc42/uploads/1770650581993-Google_Reviews_copy.png">

    <meta property="og:site_name" content="Reeves Tree Surgeons">
    <meta property="og:locale" content="en_GB">

    <!-- Additional SEO Tags -->
    <meta name="theme-color" content="#2A5F1E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.google.com">
    
    <!-- Font loading strategy with display swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"></noscript>
    
    <!-- Preload critical images for LCP optimization -->
    <link rel="preload" as="image" href="/lovable-uploads/hero-tree-work-drone-1200.webp" imagesrcset="/lovable-uploads/hero-tree-work-drone-400.webp 400w, /lovable-uploads/hero-tree-work-drone-800.webp 800w, /lovable-uploads/hero-tree-work-drone-1200.webp 1200w, /lovable-uploads/hero-tree-work-drone-2000.webp 2000w" imagesizes="100vw" type="image/webp" fetchpriority="high">
    
    
    <!-- Prefetch likely next navigation routes -->
    <link rel="prefetch" href="/contact">
    <link rel="prefetch" href="/tree-work">
    <link rel="prefetch" href="/our-work">
    

    
  
  
  
</head>

  <body>
    <!-- Skip to main content link for accessibility (data-nosnippet keeps it out of Google's search snippets) -->
    <div data-nosnippet>
      <a href="#root" class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:left-0 bg-green-600 text-white p-2 rounded z-50">Skip to main content</a>
    </div>
    
    <!-- Main App Container -->
    <div id="root" role="main" aria-label="Reeves Tree Surgeons Website"><!--app-html--></div>
    
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
